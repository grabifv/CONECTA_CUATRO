<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conecta Cuatro</title>
    <meta
      name="description"
      content="Juega al Conecta Cuatro contra un amigo o contra bots. El motor en Python se ejecuta en tu navegador con Pyodide."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f5bea'/><circle cx='11' cy='20' r='6' fill='%23ef3b3b'/><circle cx='21' cy='12' r='6' fill='%23ffc93c'/></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <button class="brand" data-nav="menu" title="Inicio">
        <span class="brand-mark" aria-hidden="true"><i class="d1"></i><i class="d2"></i><i class="d3"></i><i class="d4"></i></span>
        <span class="brand-text">Conecta<b>Cuatro</b></span>
      </button>
      <nav class="nav">
        <button data-nav="menu" class="link"><span aria-hidden="true">🏠</span> Inicio</button>
        <button data-nav="game" class="link"><span aria-hidden="true">🎮</span> Jugar</button>
        <button data-nav="scoreboard" class="link"><span aria-hidden="true">📊</span> Clasificación</button>
        <button data-nav="tournament" class="link"><span aria-hidden="true">🏆</span> Torneo</button>
        <button data-nav="about" class="link"><span aria-hidden="true">💡</span> Info</button>
        <button id="theme-toggle" class="link theme" title="Modo día / noche">🌙</button>
      </nav>
    </header>

    <!-- Boot / loading overlay -->
    <div id="boot" class="boot">
      <div class="boot-card">
        <div class="boot-board" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </div>
        <h2>Preparando el tablero…</h2>
        <p id="boot-status">Cargando Pyodide…</p>
        <p class="boot-note">
          El motor del juego y los bots están escritos en Python y se descargan para
          ejecutarse aquí mismo, en tu navegador. Solo tarda la primera vez.
        </p>
      </div>
    </div>

    <!-- Loud, persistent error surface. A blank page with a dead button is the
         least debuggable failure there is, so anything that escapes lands here. -->
    <div id="fatal" class="fatal hidden"></div>

    <!-- Screens are separate files under screens/ and injected here at boot.
         One page, one Pyodide instance: separate HTML pages would each re-boot
         the Python engine, several seconds every time you switch tab. -->
    <main id="screens"></main>

    <footer class="footer">
      <span>Hecho con Python + Pyodide · sin servidor</span>
      <a href="https://github.com/grabifv/CONECTA_CUATRO" target="_blank" rel="noopener">Código en GitHub</a>
      <a href="https://conecta-cuatro.readthedocs.io" target="_blank" rel="noopener">Documentación</a>
    </footer>

    <div id="toast" class="toast hidden"></div>

    <script src="pyodide-bootstrap.js"></script>
    <!-- Order matters: core defines the helpers the screens use, main boots last. -->
    <script src="js/core.js"></script>
    <script src="js/play.js"></script>
    <script src="js/scoreboard.js"></script>
    <script src="js/tournament.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
