<section id="screen-game" class="screen hidden">
  <div class="arena">
    <!-- Session scoreboard: one card per player, wins carried across games. -->
    <div class="scorebar">
      <div class="player-card p1" id="turn-0">
        <span class="disc" aria-hidden="true"></span>
        <div class="player-info">
          <input id="name-0" class="player-name" type="text" maxlength="16" value="Jugador 1"
                 aria-label="Nombre del jugador rojo" />
          <span class="player-botname" id="botname-0"></span>
          <span class="player-kind" id="kind-0">Persona</span>
        </div>
        <span class="score" id="score-0">0</span>
      </div>
      <div class="score-mid">
        <span class="vs">VS</span>
        <span class="draws" id="score-draws">0 empates</span>
      </div>
      <div class="player-card p2" id="turn-1">
        <span class="score" id="score-1">0</span>
        <div class="player-info">
          <input id="name-1" class="player-name" type="text" maxlength="16" value="Jugador 2"
                 aria-label="Nombre del jugador amarillo" />
          <span class="player-botname" id="botname-1"></span>
          <span class="player-kind" id="kind-1">Persona</span>
        </div>
        <span class="disc" aria-hidden="true"></span>
      </div>
    </div>

    <!-- One click to set both seats. -->
    <div class="quick" role="group" aria-label="Modo de juego">
      <button class="chip-btn" data-preset="friends">👥 Dos jugadores</button>
      <span class="quick-sep">o contra un bot:</span>
      <button class="chip-btn" data-preset="easy">🌱 Fácil</button>
      <button class="chip-btn" data-preset="medium">🧠 Medio</button>
      <button class="chip-btn" data-preset="hard">⚔️ Difícil</button>
    </div>

    <div id="status" class="status">Pulsa «Nueva partida» para empezar.</div>

    <div class="board-wrap">
      <div id="board" class="board"></div>

      <!-- Shown when a game ends; the board stays visible underneath. -->
      <div id="result" class="result hidden">
        <div class="burst" id="result-burst" aria-hidden="true"></div>
        <div class="result-card">
          <div class="result-emoji" id="result-emoji">🏆</div>
          <h2 id="result-title">¡Victoria!</h2>
          <p id="result-sub" class="muted"></p>
          <div class="result-actions">
            <button id="btn-rematch" class="btn primary big">🔁 Revancha</button>
            <button id="btn-result-close" class="btn big">Ver el tablero</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button id="btn-new" class="btn primary">✨ Nueva partida</button>
      <button id="btn-undo" class="btn" title="Deshace la última jugada">↩ Deshacer</button>
      <button id="btn-hint" class="btn" title="Sugiere una columna">💡 Pista</button>
      <button id="btn-play-ai" class="btn" title="Hace jugar al bot ahora">⏭ Turno del bot</button>
      <button id="btn-share" class="btn" title="Copia un enlace para repetir la partida">🔗 Compartir</button>
    </div>

    <div id="xray" class="xray hidden"></div>

    <details class="drawer">
      <summary>⚙️ Opciones</summary>
      <div class="drawer-body options">
        <label>🔴 Jugador rojo (empieza)
          <select id="seat-0" class="seat-select"></select>
        </label>
        <label>🟡 Jugador amarillo
          <select id="seat-1" class="seat-select"></select>
        </label>
        <label>Filas
          <input id="cfg-rows" type="number" min="4" max="10" value="6" />
        </label>
        <label>Columnas
          <input id="cfg-cols" type="number" min="4" max="10" value="7" />
        </label>
        <label>Pausa del bot (ms)
          <input id="cfg-delay" type="number" min="0" max="5000" step="100" value="600" />
        </label>
        <div class="toggles">
          <label class="switch"><input type="checkbox" id="toggle-xray" /><span class="knob"></span> Rayos X: puntuar columnas</label>
          <label class="switch"><input type="checkbox" id="toggle-why" checked /><span class="knob"></span> Apuntar las jugadas</label>
        </div>
        <button id="btn-reset-score" class="btn small">🧽 Poner el marcador a cero</button>
        <p class="muted small">El tamaño del tablero se aplica en la siguiente partida.</p>
      </div>
    </details>

    <details class="drawer">
      <summary>📝 Jugadas <span class="muted small" id="log-count"></span></summary>
      <div class="drawer-body">
        <div class="timeline">
          <button id="tl-first" class="btn small" title="Inicio">⏮</button>
          <button id="tl-prev" class="btn small" title="Jugada anterior">◀</button>
          <input id="tl-slider" type="range" min="0" max="0" value="0" aria-label="Jugada" />
          <button id="tl-next" class="btn small" title="Jugada siguiente">▶</button>
          <button id="tl-last" class="btn small" title="Ir al final">⏭</button>
          <span id="tl-label" class="tl-label">jugada 0 / 0</span>
        </div>
        <div id="why" class="why-body"></div>
      </div>
    </details>
  </div>
</section>
